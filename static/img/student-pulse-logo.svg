<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pulse Wave Vibrant Gradient -->
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00D2B4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Cap Top Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold Tassel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Glow Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.4"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Crest -->
  <rect x="12" y="12" width="176" height="176" rx="42" fill="url(#shieldGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3" filter="url(#badgeShadow)"/>

  <!-- Subtle Inner Ambient Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g id="graduationCap" transform="translate(0, -6)">
    <!-- Cap Diamond (Top) -->
    <polygon points="100,42 162,65 100,88 38,65" fill="url(#capGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Cap Diamond Highlight -->
    <polygon points="100,46 154,65 100,84 46,65" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

    <!-- Skull Cap Base (Underneath) -->
    <path d="M 62 76 L 62 96 C 62 108, 138 108, 138 96 L 138 76" fill="#0369a1" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Gold Tassel Ribbon & Bob -->
    <circle cx="100" cy="65" r="4.5" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M 100 65 Q 128 72, 144 88" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="144" cy="89" r="4" fill="url(#goldGrad)"/>
    <rect x="142" y="91" width="4" height="12" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Dynamic Glowing Heartbeat Pulse Wave (ECG) -->
  <g id="pulseWaveform" filter="url(#glowFilter)">
    <!-- Background pulse track -->
    <path d="M 28 138 L 56 138 L 68 126 L 80 156 L 96 112 L 108 162 L 120 128 L 132 144 L 144 138 L 172 138" 
          fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glowing Pulse Line -->
    <path d="M 28 138 L 56 138 L 68 126 L 80 156 L 96 112 L 108 162 L 120 128 L 132 144 L 144 138 L 172 138" 
          fill="none" stroke="url(#pulseGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse Signal Peak Node -->
    <circle cx="96" cy="112" r="5" fill="#FFFFFF" stroke="#00E5FF" stroke-width="2.5"/>
    <circle cx="108" cy="162" r="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="172" cy="138" r="4" fill="#10B981"/>
    <circle cx="28" cy="138" r="4" fill="#00E5FF"/>
  </g>

  <!-- Sparkle of Success / Placement Star -->
  <polygon points="100,24 103,32 111,35 103,38 100,46 97,38 89,35 97,32" fill="#FDE047"/>
</svg>
